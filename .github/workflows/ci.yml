name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v7

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Construir la etapa de tests del backend
        uses: docker/build-push-action@v7
        with:
          context: ./api
          target: test
          load: true
          push: false
          tags: api-test:ci
          cache-from: type=gha,scope=api-test
          cache-to: type=gha,mode=max,scope=api-test

      - name: Correr los tests del backend con coverage
        run: |
          mkdir -p api-coverage
          docker run --rm -v "${{ github.workspace }}/api-coverage:/app/coverage" api-test:ci

      - name: Resumen del coverage del backend
        if: ${{ !cancelled() }}
        run: |
          F=api-coverage/coverage-summary.json
          test -f "$F"
          node -e "
            const t = require('./$F').total;
            if (!t.lines.total) { console.error('midió 0 archivos: revisá collectCoverageFrom'); process.exit(1); }
            const f = (m) => \`| \${m} | \${t[m].pct}% |\`;
            console.log('### Coverage del backend');
            console.log('| métrica | % |'); console.log('|---|---|');
            console.log(f('lines')); console.log(f('branches')); console.log(f('functions'));
          " >> $GITHUB_STEP_SUMMARY

      - name: Publicar el coverage del backend
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: coverage-backend
          path: api-coverage

      - name: Entrar al registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen del backend
        uses: docker/build-push-action@v7
        with:
          context: ./api
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/joseruarte2004/ingsoft3-tp01-backend:sha-${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  build-client:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v7

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Construir la etapa de tests del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./client
          target: test
          load: true
          push: false
          tags: client-test:ci
          cache-from: type=gha,scope=client-test
          cache-to: type=gha,mode=max,scope=client-test

      - name: Correr los tests del frontend con coverage
        run: |
          mkdir -p client-coverage
          docker run --rm -v "${{ github.workspace }}/client-coverage:/app/coverage" client-test:ci

      - name: Resumen del coverage del frontend
        if: ${{ !cancelled() }}
        run: |
          F=client-coverage/coverage-summary.json
          test -f "$F"
          node -e "
            const t = require('./$F').total;
            if (!t.lines.total) { console.error('midió 0 archivos: revisá collectCoverageFrom'); process.exit(1); }
            const f = (m) => \`| \${m} | \${t[m].pct}% |\`;
            console.log('### Coverage del frontend');
            console.log('| métrica | % |'); console.log('|---|---|');
            console.log(f('lines')); console.log(f('branches')); console.log(f('functions'));
          " >> $GITHUB_STEP_SUMMARY

      - name: Publicar el coverage del frontend
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: coverage-frontend
          path: client-coverage

      - name: Entrar al registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./client
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/joseruarte2004/ingsoft3-tp01-frontend:sha-${{ github.sha }}
          cache-from: type=gha,scope=client
          cache-to: type=gha,mode=max,scope=client

  deploy-qa:
    runs-on: ubuntu-latest
    needs: [build-api, build-client]
    if: github.ref == 'refs/heads/main'
    environment: qa
    permissions:
      contents: read
    steps:
      # TP7: los servicios ya son "Existing Image" (no reconstruyen desde el
      # repo), así que el hook ya no dice QUÉ COMMIT construir — dice QUÉ
      # IMAGEN ejecutar. El &ref= se saca: con una imagen no hay nada que
      # compilar, y dejarlo haría creer que el proveedor todavía lo hace.
      - name: Disparar deploy en Render (api + front) — la IMAGEN del commit verificado
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API_QA }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_QA }}
        run: |
          IMG_API="ghcr.io/joseruarte2004/ingsoft3-tp01-backend:sha-${{ github.sha }}"
          IMG_FRONT="ghcr.io/joseruarte2004/ingsoft3-tp01-frontend:sha-${{ github.sha }}"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_API" "$HOOK_API"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_FRONT" "$HOOK_FRONT"

      - name: Smoke test (espera a que QA conteste)
        shell: bash
        env:
          URL_API: https://ingsoft3-api-qa-q9kf.onrender.com
          URL_FRONT: https://ingsoft3-front-qa-g1m1.onrender.com
        run: |
          echo "Esperando a que QA esté vivo..."
          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 "$URL_API/health" \
               && curl -fsS --max-time 10 "$URL_API/health/db" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/" > /dev/null; then
              echo "✅ QA responde (API + BD + front)"; exit 0
            fi
            sleep 20
          done
          echo "❌ QA no respondió a tiempo"; exit 1

  integracion:
    runs-on: ubuntu-latest
    needs: deploy-qa                        # QA ya está ejecutando la imagen de ESTA corrida
    environment: qa                         # hereda QA_TEST_USERNAME/QA_TEST_PASSWORD
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Bajar el código al runner
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install (sin browser)
        run: npm ci --legacy-peer-deps      # estas pruebas no abren navegador
        working-directory: ./client

      - name: Integración contra la api de QA
        env:
          API_BASE_URL: https://ingsoft3-api-qa-q9kf.onrender.com
          QA_TEST_USERNAME: ${{ secrets.QA_TEST_USERNAME }}
          QA_TEST_PASSWORD: ${{ secrets.QA_TEST_PASSWORD }}
        run: npx playwright test e2e/api.spec.js
        working-directory: ./client

      - name: Publicar reporte de integración
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-integracion   # distinto del de e2e: dos iguales rompen la corrida
          path: client/playwright-report
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    needs: integracion                      # si la api está rota, no gastamos un browser en confirmarlo
    environment: qa
    permissions:
      contents: read
    timeout-minutes: 20                     # si algo se cuelga, el job muere en vez de esperar horas
    steps:
      - name: Bajar el código al runner
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install + browser
        run: |
          npm ci --legacy-peer-deps
          npx playwright install --with-deps chromium
        working-directory: ./client

      - name: e2e contra QA
        env:
          E2E_BASE_URL: https://ingsoft3-front-qa-g1m1.onrender.com
          QA_TEST_USERNAME: ${{ secrets.QA_TEST_USERNAME }}
          QA_TEST_PASSWORD: ${{ secrets.QA_TEST_PASSWORD }}
        run: npx playwright test e2e/inventario.spec.js   # SU archivo: sin esto vuelve a correr la integración
        working-directory: ./client

      - name: Publicar reporte e2e
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}             # el reporte importa MÁS cuando falla (y no cuando cancelás)
        with:
          name: playwright-report-e2e
          path: client/playwright-report
          retention-days: 7

  deploy-prod:
    runs-on: ubuntu-latest
    needs: e2e                              # el gate: sin e2e verde, ni siquiera se pide aprobación
    environment: production
    permissions:
      contents: read
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      # Misma imagen que QA verificó y que las suites de abajo ejercitaron —
      # "se promueve lo mismo que se verificó" queda escrito en este imgURL,
      # no como una promesa.
      - name: Disparar deploy en Render (api + front) — la MISMA imagen aprobada
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API_PROD }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_PROD }}
        run: |
          IMG_API="ghcr.io/joseruarte2004/ingsoft3-tp01-backend:sha-${{ github.sha }}"
          IMG_FRONT="ghcr.io/joseruarte2004/ingsoft3-tp01-frontend:sha-${{ github.sha }}"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_API" "$HOOK_API"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_FRONT" "$HOOK_FRONT"

      - name: Smoke test PROD
        shell: bash
        env:
          URL_API: https://ingsoft3-api-prod-62e4.onrender.com
          URL_FRONT: https://ingsoft3-front-prod-etlo.onrender.com
        run: |
          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 "$URL_API/health" \
               && curl -fsS --max-time 10 "$URL_API/health/db" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/" > /dev/null; then
              echo "✅ PROD responde (API + BD + front)"; exit 0
            fi
            sleep 20
          done
          echo "❌ PROD no respondió a tiempo"; exit 1
