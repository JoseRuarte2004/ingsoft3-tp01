services:
  db:
    image: postgres:14-alpine
    environment:
      POSTGRES_DB: ${DB_SCHEMA}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ghcr.io/joseruarte2004/ingsoft3-tp01-backend:v0.1.0
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SCHEMA: ${DB_SCHEMA}
      SESSION_SECRET: ${SESSION_SECRET}
      COOKIE_PARSER_SECRET: ${COOKIE_PARSER_SECRET}
      PORT: 5000
    ports:
      - "5050:5000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: ghcr.io/joseruarte2004/ingsoft3-tp01-frontend:v0.1.0
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  db-data:
